<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MARK Hospitals HMS — Live</title>
<style>
:root {
  --bg-base:#0b0f14;--bg-surface:#111720;--bg-card:#161e2a;--bg-card2:#1a2333;--bg-hover:#1f2d3f;
  --border:rgba(255,255,255,0.07);--border-light:rgba(255,255,255,0.04);
  --accent:#7c3aed;--accent-dim:rgba(124,58,237,0.12);--accent-glow:rgba(124,58,237,0.28);
  --gold:#e8a020;--gold-dim:rgba(232,160,32,0.12);
  --ruby:#e84040;--ruby-dim:rgba(232,64,64,0.12);
  --sapphire:#4a90d9;--sapphire-dim:rgba(74,144,217,0.12);
  --violet:#9b5de5;--violet-dim:rgba(155,93,229,0.12);
  --emerald:#22c55e;--emerald-dim:rgba(34,197,94,0.12);
  --text-primary:#e8edf3;--text-secondary:#8a97a8;--text-muted:#4e5f72;--text-dim:#2f3e50;
  --sidebar-w:256px;--header-h:60px;
  --r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:20px;
  --tr:all 0.2s cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg-base);color:var(--text-primary);min-height:100vh;overflow-x:hidden}
#login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 20% 50%,rgba(124,58,237,0.06) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(74,144,217,0.05) 0%,transparent 50%),var(--bg-base);padding:24px}
.login-logo{text-align:center;margin-bottom:28px}
.portal-title{font-size:0.8rem;color:var(--text-muted);text-align:center;margin-bottom:20px;font-weight:500;letter-spacing:0.05em}
.login-box{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-xl);width:100%;max-width:400px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
.lb-head{padding:22px 26px;border-bottom:1px solid var(--border)}
.lb-head h3{font-family:'DM Serif Display',serif;font-size:1.1rem}
.lb-head p{font-size:0.73rem;color:var(--text-muted);margin-top:3px}
.lb-body{padding:22px 26px}
.lb-foot{padding:16px 26px;border-top:1px solid var(--border);display:flex;gap:10px}
.btn-login{flex:1;height:40px;background:var(--accent);color:white;border:none;border-radius:var(--r-md);font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;transition:var(--tr)}
.btn-login:hover{background:#6d28d9;box-shadow:0 0 20px var(--accent-glow)}
.login-err{color:var(--ruby);font-size:0.75rem;margin-top:6px;display:none}
#app{display:none;min-height:100vh}
.app-wrap{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--bg-surface);border-right:1px solid var(--border);height:100vh;position:fixed;top:0;left:0;display:flex;flex-direction:column;z-index:200;overflow:hidden}
.sidebar-header{height:var(--header-h);display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--border);gap:12px}
.logo-text h1{font-family:'DM Serif Display',serif;font-size:1.05rem}
.logo-text span{font-size:0.58rem;color:var(--text-muted);letter-spacing:0.12em;text-transform:uppercase}
.sidebar-nav{flex:1;padding:14px 10px;overflow-y:auto;min-height:0}
.nav-label{font-size:0.58rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-dim);padding:10px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-md);cursor:pointer;transition:var(--tr);color:var(--text-secondary);font-size:0.86rem;font-weight:400;position:relative;margin-bottom:1px}
.nav-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.nav-item.active{background:var(--accent-dim);color:var(--accent);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:22%;height:56%;width:3px;background:var(--accent);border-radius:0 2px 2px 0}
.nav-icon{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);font-size:0.9rem;flex-shrink:0}
.nav-item.active .nav-icon{background:var(--accent-dim)}
.nav-badge{margin-left:auto;background:var(--accent);color:white;font-size:0.62rem;font-weight:700;padding:2px 7px;border-radius:20px;font-family:'JetBrains Mono',monospace}
.nav-badge.red{background:var(--ruby)}
.sidebar-footer{padding:12px 10px;border-top:1px solid var(--border);flex-shrink:0}
.user-pill{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-md)}
.user-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;color:white}
.user-info strong{font-size:0.8rem;color:var(--text-primary);display:block;white-space:nowrap}
.user-info span{font-size:0.67rem;color:var(--text-muted)}
.status-dot{width:7px;height:7px;background:var(--emerald);border-radius:50%;flex-shrink:0;margin-left:auto;box-shadow:0 0 6px var(--emerald)}
.logout-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-md);cursor:pointer;color:var(--text-muted);font-size:0.78rem;margin-top:6px;transition:var(--tr)}
.logout-btn:hover{background:var(--ruby-dim);color:var(--ruby)}
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
.header{height:var(--header-h);background:var(--bg-surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:100}
.breadcrumb{display:flex;align-items:center;gap:6px}
.bc-root{font-size:0.7rem;color:var(--text-muted)}
.bc-sep{color:var(--text-dim);font-size:0.7rem}
.bc-cur{font-size:0.875rem;font-weight:600}
.h-right{display:flex;align-items:center;gap:8px}
.role-chip{background:var(--rc-bg,var(--accent-dim));border:1px solid var(--rc-b,rgba(124,58,237,0.2));border-radius:var(--r-md);padding:0 14px;height:32px;display:flex;align-items:center;font-size:0.72rem;font-weight:700;color:var(--rc-c,var(--accent));letter-spacing:0.06em;text-transform:uppercase}
.date-chip{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-md);padding:0 12px;height:32px;display:flex;align-items:center;font-size:0.7rem;color:var(--text-secondary);font-family:'JetBrains Mono',monospace;gap:5px}
.live-dot{width:5px;height:5px;background:var(--emerald);border-radius:50%;box-shadow:0 0 5px var(--emerald)}
.icon-btn{width:34px;height:34px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:0.88rem;color:var(--text-secondary);transition:var(--tr);position:relative}
.icon-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
.notif-pip{position:absolute;top:6px;right:6px;width:6px;height:6px;background:var(--ruby);border-radius:50%;border:1.5px solid var(--bg-surface)}
.content{padding:24px 26px;flex:1}
.page{display:none}
.page.active{display:block;animation:pageIn 0.28s cubic-bezier(0.4,0,0.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.ptb{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.ptb h2{font-family:'DM Serif Display',serif;font-size:1.55rem;line-height:1}
.ptb p{font-size:0.78rem;color:var(--text-muted);margin-top:5px}
.ptb-a{display:flex;gap:8px}
.kpi-grid{display:grid;gap:14px;margin-bottom:22px}
.kpi-grid.six{grid-template-columns:repeat(6,1fr)}
.kpi-grid.four{grid-template-columns:repeat(4,1fr)}
.kpi-grid.three{grid-template-columns:repeat(3,1fr)}
.kpi-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;position:relative;overflow:hidden;transition:var(--tr)}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--kc,var(--accent))}
.kpi-card:hover{background:var(--bg-hover);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.kpi-icon{width:34px;height:34px;background:var(--kd,var(--accent-dim));border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:0.95rem}
.kpi-trend{font-size:0.67rem;font-weight:600;font-family:'JetBrains Mono',monospace;padding:3px 8px;border-radius:20px}
.kpi-trend.up{background:var(--emerald-dim);color:var(--emerald)}
.kpi-trend.dn{background:var(--ruby-dim);color:var(--ruby)}
.kpi-trend.fl{background:var(--bg-card2);color:var(--text-muted)}
.kpi-val{font-family:'DM Serif Display',serif;font-size:1.7rem;line-height:1;margin-bottom:4px}
.kpi-lbl{font-size:0.7rem;color:var(--text-muted);font-weight:500}
.panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
.ph{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.pt{font-size:0.86rem;font-weight:600;display:flex;align-items:center;gap:8px}
.ptd{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
.pa{display:flex;gap:8px;align-items:center}
.dt{width:100%;border-collapse:collapse}
.dt thead tr{background:var(--bg-surface)}
.dt th{padding:10px 16px;text-align:left;font-size:0.63rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);border-bottom:1px solid var(--border);white-space:nowrap}
.dt td{padding:12px 16px;font-size:0.81rem;color:var(--text-secondary);border-bottom:1px solid var(--border-light);vertical-align:middle}
.dt tr:last-child td{border-bottom:none}
.dt tbody tr:hover{background:var(--bg-hover)}
.dt td strong{color:var(--text-primary);font-weight:500}
.mono{font-family:'JetBrains Mono',monospace;font-size:0.75rem}
.ar{display:flex;align-items:center;gap:10px}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.67rem;font-weight:700;color:white;flex-shrink:0}
.avi strong{font-size:0.81rem;color:var(--text-primary);display:block}
.avi span{font-size:0.68rem;color:var(--text-muted)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:0.66rem;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;white-space:nowrap}
.badge::before{content:'';width:4px;height:4px;border-radius:50%}
.bg{background:var(--emerald-dim);color:var(--emerald)}.bg::before{background:var(--emerald)}
.br{background:var(--ruby-dim);color:var(--ruby)}.br::before{background:var(--ruby)}
.by{background:var(--gold-dim);color:var(--gold)}.by::before{background:var(--gold)}
.bb{background:var(--sapphire-dim);color:var(--sapphire)}.bb::before{background:var(--sapphire)}
.bt{background:var(--accent-dim);color:var(--accent)}.bt::before{background:var(--accent)}
.bv{background:var(--violet-dim);color:var(--violet)}.bv::before{background:var(--violet)}
.bgr{background:var(--bg-card2);color:var(--text-muted)}.bgr::before{background:var(--text-muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:0 14px;height:34px;border-radius:var(--r-md);font-family:'DM Sans',sans-serif;font-size:0.8rem;font-weight:600;border:none;cursor:pointer;transition:var(--tr);white-space:nowrap}
.btn-a{background:var(--accent);color:white}.btn-a:hover{background:#6d28d9;box-shadow:0 0 16px var(--accent-glow)}
.btn-g{background:var(--bg-card2);color:var(--text-secondary);border:1px solid var(--border)}.btn-g:hover{background:var(--bg-hover);color:var(--text-primary)}
.btn-d{background:var(--ruby-dim);color:var(--ruby);border:1px solid rgba(232,64,64,0.2)}.btn-d:hover{background:var(--ruby);color:white}
.btn-gold{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(232,160,32,0.2)}.btn-gold:hover{background:var(--gold);color:#0b0f14}
.btn-sm{height:28px;padding:0 11px;font-size:0.72rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g-ma{display:grid;grid-template-columns:1fr 320px;gap:18px}
.g-64{display:grid;grid-template-columns:60fr 40fr;gap:18px}
.pw{height:4px;background:var(--bg-card2);border-radius:2px;overflow:hidden;margin-top:5px}
.pf{height:100%;border-radius:2px}
.al{padding:4px 0}
.ai{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--border-light);transition:var(--tr);cursor:pointer}
.ai:last-child{border-bottom:none}
.ai:hover{background:var(--bg-hover)}
.at{font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--text-muted);width:50px;text-align:right;flex-shrink:0}
.as{width:2px;height:36px;border-radius:2px;flex-shrink:0}
.ab{flex:1}
.ab strong{font-size:0.81rem;color:var(--text-primary);display:block;font-weight:500}
.ab span{font-size:0.68rem;color:var(--text-muted)}
.sr{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-light)}
.sr:last-child{border-bottom:none}
.sr-l{font-size:0.79rem;color:var(--text-secondary)}
.sr-v{font-size:0.82rem;font-weight:600;font-family:'JetBrains Mono',monospace}
.dr{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border-light)}
.dr:last-child{border-bottom:none}
.dn{font-size:0.78rem;color:var(--text-secondary);width:110px;flex-shrink:0}
.dw{flex:1;height:4px;background:var(--bg-card2);border-radius:2px;overflow:hidden}
.df{height:100%;border-radius:2px}
.dv{font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--text-muted);width:44px;text-align:right;flex-shrink:0}
.bb-bar{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:20px}
.bc{padding:20px 24px;border-right:1px solid var(--border);position:relative}
.bc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--cc,var(--accent))}
.bc:last-child{border-right:none}
.bc-lbl{font-size:0.66rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.1em;font-weight:600;margin-bottom:8px}
.bc-val{font-family:'DM Serif Display',serif;font-size:1.6rem}
.bc-sub{font-size:0.68rem;color:var(--text-muted);margin-top:4px}
.isel{background:var(--bg-card2);border:1px solid var(--border);border-radius:var(--r-sm);padding:4px 10px;font-family:'DM Sans',sans-serif;font-size:0.74rem;color:var(--text-secondary);outline:none;cursor:pointer}
.iinp{background:var(--bg-card2);border:1px solid var(--border);border-radius:var(--r-sm);padding:5px 12px;font-family:'DM Sans',sans-serif;font-size:0.77rem;color:var(--text-secondary);outline:none;width:200px}
.iinp::placeholder{color:var(--text-muted)}
.iinp:focus{border-color:var(--accent)}
.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.qa{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;text-align:center;cursor:pointer;transition:var(--tr);position:relative;overflow:hidden}
.qa:hover{border-color:rgba(255,255,255,0.14);transform:translateY(-2px)}
.qa-i{font-size:1.35rem;margin-bottom:8px}
.qa-l{font-size:0.73rem;font-weight:600;color:var(--text-secondary)}
.mb{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);z-index:500;align-items:center;justify-content:center}
.mb.open{display:flex}
.mbox{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-xl);width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 32px 80px rgba(0,0,0,0.5);animation:mslide 0.22s cubic-bezier(0.4,0,0.2,1)}
@keyframes mslide{from{transform:translateY(18px) scale(0.97);opacity:0}to{transform:none;opacity:1}}
.mh{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mh h3{font-family:'DM Serif Display',serif;font-size:1.1rem}
.mx{width:28px;height:28px;background:var(--bg-card2);border:1px solid var(--border);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);font-size:0.82rem;transition:var(--tr)}
.mx:hover{background:var(--ruby-dim);color:var(--ruby)}
.mbody{padding:22px 24px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.fgl{margin-bottom:13px}
.fgl label{display:block;font-size:0.68rem;font-weight:700;color:var(--text-muted);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:5px}
.fgl input,.fgl select,.fgl textarea{width:100%;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-md);padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:0.83rem;color:var(--text-primary);outline:none;transition:var(--tr)}
.fgl input:focus,.fgl select:focus,.fgl textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.fgl input::placeholder{color:var(--text-dim)}
.fgl select option{background:var(--bg-card)}
.mf{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.info-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;margin-bottom:18px}
.info-card h3{font-family:'DM Serif Display',serif;font-size:1rem;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-light)}
.info-row:last-child{border-bottom:none}
.info-row .lbl{font-size:0.75rem;color:var(--text-muted)}
.info-row .val{font-size:0.82rem;font-weight:600}
.welcome-banner{background:linear-gradient(135deg,var(--accent-dim),transparent);border:1px solid rgba(124,58,237,0.2);border-radius:var(--r-lg);padding:20px 24px;margin-bottom:24px;display:flex;align-items:center;gap:16px}
.wb-icon{font-size:2rem}
.wb-text h3{font-family:'DM Serif Display',serif;font-size:1.1rem}
.wb-text p{font-size:0.78rem;color:var(--text-muted);margin-top:3px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--bg-card2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:13px 18px;font-size:0.83rem;box-shadow:0 8px 32px rgba(0,0,0,0.4);z-index:9999;display:none;max-width:300px}
.toast.show{display:block;animation:tin 0.22s cubic-bezier(0.4,0,0.2,1)}
@keyframes tin{from{transform:translateX(14px);opacity:0}to{transform:none;opacity:1}}
.empty-state{text-align:center;padding:48px 20px;color:var(--text-muted)}
.empty-state .ei{font-size:2.5rem;margin-bottom:12px}
.empty-state p{font-size:0.82rem}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg-hover);border-radius:2px}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-logo">
    <img id="login-logo-img" style="height:64px;width:auto;object-fit:contain;border-radius:10px;margin:0 auto 12px;display:block"/>
    <h1 style="font-family:'DM Serif Display',serif;font-size:2rem">MARK Hospitals</h1>
    <p style="font-size:0.78rem;color:var(--text-muted);letter-spacing:0.1em;text-transform:uppercase;margin-top:4px">Hospital Management System — Enterprise</p>
  </div>
  <p class="portal-title">Sign in with your hospital account</p>
  <div class="login-box">
    <div class="lb-head"><h3>Welcome</h3><p>Continue to the hospital management dashboard</p></div>
    <div class="lb-foot"><button class="btn-login" onclick="doLogin()">Continue →</button></div>
  </div>
</div>

<!-- APP SHELL -->
<div id="app">
<div class="app-wrap">
<aside class="sidebar">
  <div class="sidebar-header">
    <img id="sidebar-logo" style="height:38px;width:auto;object-fit:contain;border-radius:6px;flex-shrink:0"/>
    <div class="logo-text"><h1>MARK</h1><span>Hospitals HMS</span></div>
  </div>
  <nav class="sidebar-nav" id="sidebar-nav"></nav>
  <div class="sidebar-footer">
    <div class="user-pill">
      <div class="user-avatar" id="ua"></div>

<div class="mb" id="m-addPatient">
  <div class="mbox">
    <div class="mh"><h3>Admit New Patient</h3><div class="mx" onclick="closeM('addPatient')">✕</div></div>
    <div class="mbody">
      <div class="fr">
        <div class="fgl"><label>First Name *</label><input id="ap-fname" type="text" placeholder="e.g. Aarav"/></div>
        <div class="fgl"><label>Last Name *</label><input id="ap-lname" type="text" placeholder="e.g. Patel"/></div>
      </div>
      <div class="fr">
        <div class="fgl"><label>Age</label><input id="ap-age" type="number" min="0" max="150" placeholder="e.g. 34"/></div>
        <div class="fgl"><label>Gender</label><select id="ap-gender"><option>Male</option><option>Female</option><option>Other</option></select></div>
      </div>
      <div class="fr">
        <div class="fgl"><label>Phone</label><input id="ap-phone" type="tel" placeholder="+91 98765 43210"/></div>
        <div class="fgl"><label>Blood Group</label><select id="ap-blood"><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select></div>
      </div>
      <div class="fr">
        <div class="fgl"><label>Ward</label><select id="ap-ward"><option>General</option><option>ICU</option><option>Ortho</option><option>Neuro</option><option>Maternity</option><option>Oncology</option></select></div>
        <div class="fgl"><label>Assigned Doctor</label><select id="ap-doctor"></select></div>
      </div>
      <div class="fgl"><label>Primary Diagnosis *</label><input id="ap-diag" type="text" placeholder="e.g. Hypertension"/></div>
      <div class="fgl"><label>Status</label><select id="ap-status"><option>Stable</option><option>Critical</option><option>Under Obs.</option><option>Improving</option><option>Monitoring</option></select></div>
    </div>
    <div class="mf"><button class="btn btn-g" onclick="closeM('addPatient')">Cancel</button><button class="btn btn-a" onclick="admitPatient()">Admit Patient</button></div>
  </div>
</div>

<div class="mb" id="m-bookAppt">
  <div class="mbox">
    <div class="mh"><h3>Book Appointment</h3><div class="mx" onclick="closeM('bookAppt')">✕</div></div>
    <div class="mbody">
      <div class="fr">
        <div class="fgl"><label>Patient Name *</label><input id="ba-patient" type="text" placeholder="Patient name…"/></div>
        <div class="fgl"><label>Doctor</label><select id="ba-doctor"></select></div>
      </div>
      <div class="fr">
        <div class="fgl"><label>Date *</label><input id="ba-date" type="date"/></div>
        <div class="fgl"><label>Time Slot</label><select id="ba-time"><option>09:00 AM</option><option>10:00 AM</option><option>10:30 AM</option><option>11:00 AM</option><option>12:00 PM</option><option>02:00 PM</option><option>03:00 PM</option><option>04:00 PM</option></select></div>
      </div>
      <div class="fr">
        <div class="fgl"><label>Type</label><select id="ba-type"><option>Consultation</option><option>Follow-up</option><option>Procedure</option></select></div>
        <div class="fgl"><label>Department</label><select id="ba-dept"><option>Cardiology</option><option>Orthopaedics</option><option>Neurology</option><option>Gynaecology</option><option>Oncology</option><option>General</option></select></div>
      </div>
    </div>
    <div class="mf"><button class="btn btn-g" onclick="closeM('bookAppt')">Cancel</button><button class="btn btn-a" onclick="bookAppointment()">Book Appointment</button></div>

</div>

<div class="mb" id="m-addMed">
  <div class="mbox">
    <div class="mh"><h3>Add Medicine</h3><div class="mx" onclick="closeM('addMed')">✕</div></div>
    <div class="mbody">

        <div class="fgl"><label>Medicine Name *</label><input id="med-name" type="text" placeholder="e.g. Metformin 500mg"/></div>
        <div class="fgl"><label>Category</label><select id="med-cat"><option>Antidiabetic</option><option>Cardiac</option><option>Antibiotic</option><option>Emergency</option><option>Analgesic</option><option>Other</option></select></div>
      </div>
      <div class="fr">
        <div class="fgl"><label>Quantity *</label><input id="med-qty" type="number" min="0" placeholder="0"/></div>
        <div class="fgl"><label>Unit</label><select id="med-unit"><option>Tablets</option><option>Capsules</option><option>Vials</option><option>Bottles</option><option>Ampoules</option></select></div>
      </div>
      <div class="fr">
        <div class="fgl"><label>Expiry Date</label><input id="med-expiry" type="date"/></div>

</div>

<div class="mb" id="m-addBill">

function statusBadge(s) {
  const m = { 'Stable':'bg','Critical':'br','Under Obs.':'by','Improving':'bb','Monitoring':'bv','Scheduled':'bgr','Waiting':'br','In Progress':'by','Completed':'bg','On Duty':'bg','In Surgery':'by','Off Duty':'br','Paid':'bg','Partial':'by','Pending':'br','In Stock':'bg','Low Stock':'by','Critical Low':'br','Done':'bg','Dispensed':'bg','Drug Alert':'br' };
  return `<span class="badge ${m[s]||'bgr'}">${s}</span>`;
}
function apptTypeBadge(t) { const m={'Follow-up':'bt','Procedure':'bv','Consultation':'bb','Consult':'bb'}; return `<span class="badge ${m[t]||'bt'}">${t}</span>`; }
function fmtCurrency(n) { return '₹' + Number(n).toLocaleString('en-IN'); }
function makeInitials(fname,lname) { return (fname[0]+(lname?lname[0]:'')).toUpperCase(); }
function randomColor() { const c=['linear-gradient(135deg,#0f7d8c,#006c7f)','linear-gradient(135deg,#7c3aed,#5b21b6)','linear-gradient(135deg,#16a34a,#0f7a30)','linear-gradient(135deg,#d97706,#b45309)','linear-gradient(135deg,#dc2626,#b91c1c)','linear-gradient(135deg,#1a3160,#0f2044)']; return c[Math.floor(Math.random()*c.length)]; }
function today() { return new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).replace(/ /g,' '); }

function startClock() {

  }
  tick(); setInterval(tick, 1000);
}

function navLabel(t) { const d=document.createElement('div'); d.className='nav-label'; d.textContent=t; return d; }
function navItem(icon, label, pageId, badge, badgeRed, isFirst) {
  const d=document.createElement('div'); d.className='nav-item'+(isFirst?' active':'');
  d.innerHTML=`<div class="nav-icon">${icon}</div>${label}${badge?`<span class="nav-badge${badgeRed?' red':''}">${badge}</span>`:''}`;
  d.onclick=()=>{ document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); d.classList.add('active'); showPage(pageId); document.getElementById('bc').textContent=label; };
  return d;
}
function showPage(id) { document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); const p=document.getElementById(id); if(p) p.classList.add('active'); }
function addPage(id, html) { const mc=document.getElementById('main-content'); const d=document.createElement('div'); d.className='page'; d.id=id; d.innerHTML=html; mc.appendChild(d); }
function populateDoctorSelects() {
  const names = DB.doctors.map(d=>d.name);

    const sel = document.getElementById(id); if(!sel) return;
    sel.innerHTML = names.map(n=>`<option>${n}</option>`).join('');
  });

  document.getElementById('bill-date') && (document.getElementById('bill-date').value = new Date().toISOString().split('T')[0]);
}

function admitPatient() {
  const fname = document.getElementById('ap-fname').value.trim();
  const lname = document.getElementById('ap-lname').value.trim();
  const diag  = document.getElementById('ap-diag').value.trim();
  if (!fname || !lname || !diag) { toast('⚠ Please fill in required fields (Name, Diagnosis)'); return; }
  DB._patientCounter++;
  const id = 'P-' + String(DB._patientCounter).padStart(3,'0');
  DB.patients.push({
    id, fname, lname,
    age: document.getElementById('ap-age').value || '—',
    gender: document.getElementById('ap-gender').value,
    phone: document.getElementById('ap-phone').value || '—',
    blood: document.getElementById('ap-blood').value,
    ward: document.getElementById('ap-ward').value,
    doctor: document.getElementById('ap-doctor').value,
    diag, status: document.getElementById('ap-status').value,
    admitted: today(),
    initials: makeInitials(fname, lname),
    color: randomColor()
  });
  closeM('addPatient');
  ['ap-fname','ap-lname','ap-age','ap-phone','ap-diag'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  toast(`✓ Patient ${id} (${fname} ${lname}) admitted successfully!`);
  refreshCurrentPage();
}

function bookAppointment() {
  const patient = document.getElementById('ba-patient').value.trim();
  const date    = document.getElementById('ba-date').value;
  if (!patient || !date) { toast('⚠ Patient name and date are required'); return; }
  const dateStr = new Date(date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  DB.appointments.push({
    time: document.getElementById('ba-time').value,
    patient,
    doctor: document.getElementById('ba-doctor').value,
    dept: document.getElementById('ba-dept').value,
    type: document.getElementById('ba-type').value,
    duration: '30 min',
    status: 'Scheduled',
    date: dateStr
  });
  closeM('bookAppt');
  document.getElementById('ba-patient').value = '';
  toast(`✓ Appointment booked for ${patient} on ${dateStr}!`);
  refreshCurrentPage();
}

function addMedicine() {
  const name = document.getElementById('med-name').value.trim();
  const qty  = parseInt(document.getElementById('med-qty').value) || 0;
  if (!name) { toast('⚠ Medicine name is required'); return; }
  const reorder = parseInt(document.getElementById('med-reorder').value) || 50;
  let status = qty === 0 ? 'Out of Stock' : qty < reorder ? (qty < reorder*0.2 ? 'Critical Low' : 'Low Stock') : 'In Stock';
  DB.medicines.push({
    name, cat: document.getElementById('med-cat').value,
    qty, unit: document.getElementById('med-unit').value,
    expiry: document.getElementById('med-expiry').value || '—',
    reorder, status
  });
  closeM('addMed');
  ['med-name','med-qty','med-expiry','med-reorder'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  toast(`✓ ${name} added to inventory!`);
  refreshCurrentPage();
}

function createInvoice() {
  const patient = document.getElementById('bill-patient').value.trim();
  const service = document.getElementById('bill-service').value.trim();
  const amount  = parseFloat(document.getElementById('bill-amount').value) || 0;
  if (!patient || !service || !amount) { toast('⚠ Patient, service and amount are required'); return; }
  DB._invoiceCounter++;
  const id = 'INV-' + DB._invoiceCounter;
  const dateStr = new Date(document.getElementById('bill-date').value || Date.now()).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  DB.invoices.unshift({ id, patient, service, amount, date: dateStr, mode: document.getElementById('bill-mode').value, status: document.getElementById('bill-status').value });
  closeM('addBill');
  ['bill-patient','bill-service','bill-amount'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  toast(`✓ Invoice ${id} created for ${fmtCurrency(amount)}!`);
  refreshCurrentPage();
}

function refreshCurrentPage() {
  const active = document.querySelector('.nav-item.active');
  if (active) active.click();
}

function filterTable(inputId, tableBodyId) {
  const q = document.getElementById(inputId).value.toLowerCase();
  document.querySelectorAll('#'+tableBodyId+' tr').forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
  const visible = document.querySelectorAll('#'+tableBodyId+' tr:not([style*="none"])').length;
  let empty = document.getElementById(tableBodyId+'-empty');
  if (!empty) { empty=document.createElement('tr'); empty.id=tableBodyId+'-empty'; empty.innerHTML=`<td colspan="20" style="text-align:center;padding:32px;color:var(--text-muted)">🔍 No results found for "<strong>${q}</strong>"</td>`; document.getElementById(tableBodyId).parentNode.appendChild(empty); }
  empty.style.display = visible===0 ? '' : 'none';
}

function renderInvoiceTable(invoices) {
  if (!invoices.length) return `<div class="empty-state"><div class="ei">💳</div><p>No invoices yet.</p></div>`;
  return `<table class="dt"><thead><tr><th>Invoice</th><th>Patient</th><th>Service</th><th>Amount</th><th>Date</th><th>Mode</th><th>Status</th><th></th></tr></thead><tbody id="inv-tbody">` +
    invoices.map(i => `<tr>
      <td class="mono"><strong>${i.id}</strong></td>

    </tr>`).join('') + '</tbody></table>';
}

function renderMedicineTable(meds) {
  if (!meds.length) return `<div class="empty-state"><div class="ei">💊</div><p>No medicines in inventory.</p></div>`;
  return `<table class="dt"><thead><tr><th>Medicine</th><th>Category</th><th>Stock</th><th>Reorder Lvl</th><th>Expiry</th><th>Status</th><th></th></tr></thead><tbody id="med-tbody">` +
    meds.map(m => {
      const pct = Math.min(100, Math.round((m.qty / Math.max(m.reorder*2, m.qty+1))*100));
      const barColor = m.status==='In Stock'?'var(--emerald)': m.status==='Low Stock'?'var(--gold)':'var(--ruby)';
      return `<tr>
        <td><strong>${m.name}</strong></td>
        <td>${m.cat}</td>
        <td><div class="mono" style="color:${barColor}">${m.qty} ${m.unit}</div><div class="pw" style="width:90px"><div class="pf" style="width:${pct}%;background:${barColor}"></div></div></td>
        <td class="mono">${m.reorder}</td>
        <td class="mono">${m.expiry}</td>
        <td>${statusBadge(m.status)}</td>
        <td><button class="btn btn-g btn-sm" onclick="toast('Editing ${m.name}')">Edit</button></td>
      </tr>`;
    }).join('') + '</tbody></table>';
}

// KPI counts (dynamic)
function getKPIs() {
  const total = DB.patients.length;
  const icu = DB.patients.filter(p=>p.ward==='ICU').length;
  const today_appts = DB.appointments.filter(a=>a.date.includes('Mar 2026')).length;
  const lowStock = DB.medicines.filter(m=>m.status!=='In Stock').length;
  const revenue = DB.invoices.filter(i=>i.status==='Paid').reduce((s,i)=>s+i.amount,0);
  return { total, icu, today_appts, lowStock, revenue };
}

  document.getElementById('r-dash').classList.add('active');
  document.querySelectorAll('.nav-item').forEach(item=>{
    const orig=item.onclick; item.onclick=function(){ orig&&orig.call(this); const id=document.querySelector('.page.active')?.id; if(id==='r-patients') renderReceptPatients(); if(id==='r-appts') renderReceptAppts(); };

function registerPatientFromDesk() {
  const fname=document.getElementById('rr-fname').value.trim(), lname=document.getElementById('rr-lname').value.trim(), diag=document.getElementById('rr-diag').value.trim();
  if(!fname||!lname||!diag){toast('⚠ Name and complaint are required');return;}
  DB._patientCounter++;
  const id='P-'+String(DB._patientCounter).padStart(3,'0');
  DB.patients.push({ id, fname, lname, age:document.getElementById('rr-age').value||'—', gender:document.getElementById('rr-gen').value, phone:document.getElementById('rr-phone').value||'—', blood:document.getElementById('rr-blood').value, ward:'General', doctor:document.getElementById('rr-doc').value, diag, status:'Stable', admitted:today(), initials:makeInitials(fname,lname), color:randomColor() });
  ['rr-fname','rr-lname','rr-age','rr-phone','rr-diag'].forEach(i=>{const el=document.getElementById(i);if(el)el.value='';});
  toast(`✓ Patient ${id} (${fname} ${lname}) registered!`);
}

</div>

${renderApptTable(DB.appointments.slice(0,5))}</div>`;

function renderReceptAppts() {

<div class="panel"><div class="ph"><div class="pt"><div class="ptd"></div>All Appointments</div><input class="iinp" type="text" placeholder="🔍 Search…" oninput="filterTable('ra-search','appt-tbody')" id="ra-search"/></div>${renderApptTable(DB.appointments)}</div>`;

  document.getElementById('ph-dash').classList.add('active');
  document.querySelectorAll('.nav-item').forEach(item=>{

function buildFinance(nav) {
  nav.appendChild(navLabel('Finance'));
  nav.appendChild(navItem('◈','Dashboard','f-dash',null,false,true));

function renderFinanceDash() {
  const paid=DB.invoices.filter(i=>i.status==='Paid').reduce((s,i)=>s+i.amount,0);

  <div class="bc" style="--cc:var(--accent)"><div class="bc-lbl">Total Billed</div><div class="bc-val">${fmtCurrency(total)}</div><div class="bc-sub">${DB.invoices.length} invoices</div></div>
  <div class="bc" style="--cc:var(--emerald)"><div class="bc-lbl">Collected</div><div class="bc-val">${fmtCurrency(paid)}</div><div class="bc-sub">${total?Math.round(paid/total*100):0}% collection rate</div></div>
  <div class="bc" style="--cc:var(--ruby)"><div class="bc-lbl">Outstanding</div><div class="bc-val">${fmtCurrency(total-paid)}</div><div class="bc-sub">${DB.invoices.filter(i=>i.status!=='Paid').length} pending</div></div>

}
function renderFinanceInvoices() {
  const paid=DB.invoices.filter(i=>i.status==='Paid').reduce((s,i)=>s+i.amount,0);
  const total=DB.invoices.reduce((s,i)=>s+i.amount,0);
  document.getElementById('f-inv').innerHTML=`<div class="ptb"><div><h2>Invoices</h2><p>${DB.invoices.length} total · ${fmtCurrency(total)} billed</p></div><button class="btn btn-a" onclick="openM('addBill')">+ Create Invoice</button></div>

function filterFinanceInvoices() {
  const s=document.getElementById('fi-filter').value;
  document.getElementById('finance-inv-wrap').innerHTML=renderInvoiceTable(s?DB.invoices.filter(i=>i.status===s):DB.invoices);
}

// ════════════════════════════════════════
//  MODAL HELPERS
// ════════════════════════════════════════
function openM(id){ document.getElementById('m-'+id).classList.add('open'); }
function closeM(id){ document.getElementById('m-'+id).classList.remove('open'); }
document.querySelectorAll('.mb').forEach(b=>b.addEventListener('click',e=>{ if(e.target===b) b.classList.remove('open'); }));

// ════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════
function toast(msg) {
  const t=document.getElementById('toast');
  t.innerHTML=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),3500);
}
</script>
